[project]
name = "linkintel-backend"
version = "0.1.0"
description = "LinkIntel backend: crawl engine, intelligence engines, API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "crawlee[beautifulsoup,playwright]>=1.9",
    "dnspython>=2.6",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    # Pinned <1.0: the 1.x line moves onto a separate `httpx2` transport
    # that this project's respx-based HTTP mocking (used consistently
    # across every other provider's tests -- Ollama, Common Crawl) can't
    # intercept. The wire format this project depends on (the web search
    # tool's request/response shape) is unchanged between the two SDK
    # major versions; only client-side ergonomics differ. Revisit when
    # respx (or an alternative) supports httpx2.
    "anthropic>=0.100,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiomatic pattern is Depends()/Query()/Path() as argument
# defaults -- not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
